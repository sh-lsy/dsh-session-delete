# Bundle patch for @sh-lsy/dsh-session-delete.
#
# One row mounts both halves: the Node entry registers the owner-only delete
# routes (single/batch) and the turn-undo routes, plus the per-turn snapshot
# recorder; the `dsh.client` declaration in package.json makes the Web shell
# load `client.js` (delete menus/dialogs and the message undo icon).
#
# Patch a row by id with a complete `config` object to change the defaults:
#   - id: session-delete
#     config: { requireTitleConfirmation: true, retentionDays: 14 }
- insert:
    - id: session-delete
      name: '@sh-lsy/dsh-session-delete'
      config:
        requireTitleConfirmation: false
        deleteSpillArtifacts: true
        worktreeTimeoutMs: 20000
        stopSettleMs: 8000
        spillRoots: []
        snapshotEnabled: true
        retentionDays: 7
        timeoutMs: 30000
        outputMaxBytes: 8388608
        dataRoot: ''